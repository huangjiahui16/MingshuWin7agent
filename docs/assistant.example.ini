# 明枢Win7 — 配置模板（把这个文件复制成 data\assistant.ini，再填自己的 Key）

[llm]
# 任意 OpenAI 兼容接口。DeepSeek: https://api.deepseek.com/v1
base_url = https://api.deepseek.com/v1
# 把这里换成你自己的 Key。仓库里永远不要提交真实 Key。
api_key = 
# DeepSeek: deepseek-flash（快、便宜）/ deepseek-v4-pro（最强，贵）
model = deepseek-flash
max_tokens = 1024

[assistant]
system_prompt = 你是一个运行在用户自己电脑上的个人助手，回答简洁、实用，一律用中文。
max_history = 8
enable_drop = true
skills_enforced = true
lang = zh

[agent]
tool_output_chars = 1500
max_steps = 6
max_tools = 0
auto_approve = false
perm_gear = ask
workspace =

[memory]
enabled = true
auto = true
max_inject = 20
max_keep = 200
